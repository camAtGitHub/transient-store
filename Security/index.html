<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C.A.M.C.E. Security Correlation Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>C.A.M.C.E. Correlation Engine</h1>
    <div class="status"><span id="statusDot" class="dot idle"></span><span id="statusText">Idle</span></div>
  </header>

  <main class="layout">
    <aside class="panel controls">
      <section>
        <h2>Connection</h2>
        <label>Endpoint <input id="endpoint" placeholder="https://opensearch.local:9200" /></label>
        <label>Username <input id="username" placeholder="admin" /></label>
        <label>Password <input id="password" type="password" /></label>
        <button id="connectBtn">Fetch Findings</button>
      </section>

      <section>
        <h2>Time Range (UTC)</h2>
        <div class="row">
          <label>Preset
            <select id="timePreset">
              <option value="60">Last 1h</option>
              <option value="240">Last 4h</option>
              <option value="1440" selected>Last 24h</option>
              <option value="10080">Last 7d</option>
              <option value="custom">Custom</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>Start <input id="startTime" type="datetime-local"></label>
          <label>End <input id="endTime" type="datetime-local"></label>
        </div>
      </section>

      <section>
        <h2>Correlation</h2>
        <div id="fieldChecks" class="checks"></div>
        <label>Extra fields (comma, dot path)
          <input id="extraFields" placeholder="process.name, source.ip" />
        </label>
        <label>Story window (minutes)
          <input id="storyWindow" type="number" min="1" max="720" value="15" />
        </label>
        <label>Noise floor (edge weight)
          <input id="noiseFloor" type="range" min="1" max="15" value="1" />
        </label>
        <label>Hub threshold
          <input id="hubThreshold" type="number" min="3" max="50" value="8" />
        </label>
        <button id="rebuildBtn">Rebuild Graph</button>
      </section>

      <section>
        <h2>Playback</h2>
        <div class="row">
          <button id="playBtn">▶ Play</button>
          <button id="pauseBtn">⏸ Pause</button>
          <button id="stepBtn">Step +</button>
        </div>
        <input id="timeline" type="range" min="0" max="100" value="100" />
      </section>

      <section>
        <h2>Analysis</h2>
        <label>Search node <input id="searchInput" placeholder="IP/user/host/id" /></label>
        <div class="row">
          <button id="shortestBtn">Shortest Path</button>
          <button id="khopBtn">K-Hop (2)</button>
          <button id="resetViewBtn">Reset View</button>
        </div>
        <div id="stats" class="stats"></div>
      </section>
    </aside>

    <section class="graphWrap">
      <canvas id="graphCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="legend" class="legend"></div>
    </section>

    <aside class="panel details">
      <h2>Details</h2>
      <div id="selectionDetails">Select a node or edge.</div>
      <h2>Pivots</h2>
      <div id="pivotList"></div>
    </aside>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
