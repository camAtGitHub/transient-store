<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C.A.M.C.E — Correlation Engine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>C.A.M.C.E <span>Correlation Engine</span></h1>
        <p>Findings + IOC + hunt graph correlation for OpenSearch Security Analytics.</p>
      </div>
      <div id="statusPill" class="status loading">Disconnected</div>
    </header>

    <section class="controls">
      <details id="connectionDetails" open>
        <summary>Connection</summary>
        <div class="row">
          <label>Host <input id="hostInput" placeholder="https://opensearch.example:9200" /></label>
          <label>User <input id="userInput" /></label>
          <label>Password <input id="passInput" type="password" /></label>
          <button id="connectBtn">Connect & Fetch</button>
        </div>
      </details>

      <div class="row">
        <label>Relative range
          <select id="relativeRange">
            <option value="1h">1h</option>
            <option value="4h" selected>4h</option>
            <option value="12h">12h</option>
            <option value="1d">1d</option>
            <option value="7d">7d</option>
            <option value="30d">30d</option>
          </select>
        </label>
        <label>Absolute start <input id="absStart" type="datetime-local" /></label>
        <label>Absolute end <input id="absEnd" type="datetime-local" /></label>
        <button id="applyTimeBtn">Apply Time Filter</button>
      </div>

      <div class="row">
        <label><input class="fieldChk" type="checkbox" value="related.ip" checked />related.ip</label>
        <label><input class="fieldChk" type="checkbox" value="related.user" checked />related.user</label>
        <label><input class="fieldChk" type="checkbox" value="related.hosts" checked />related.hosts</label>
        <label><input class="fieldChk" type="checkbox" value="related.email" />related.email</label>
        <label><input class="fieldChk" type="checkbox" value="related.domain" />related.domain</label>
        <label>Custom fields <input id="customFields" placeholder="process.name, source.ip" /></label>
      </div>

      <div class="row">
        <label>Story window minutes <input id="storyWindow" type="number" value="30" min="1" /></label>
        <label>Hub threshold <input id="hubThreshold" type="number" value="5" min="2" /></label>
        <label><input id="meshToggle" type="checkbox" checked /> Co-occurrence mesh</label>
        <label><input id="temporalToggle" type="checkbox" checked /> Temporal bridges</label>
        <button id="recorrelateBtn">Re-correlate</button>
      </div>

      <div class="row">
        <input id="huntQuery" placeholder="Lucene hunt query, e.g. user.name:jsmith AND event.action:ssh_login" />
        <button id="huntBtn">Run Hunt</button>
        <button id="sampleBtn">Load Demo Dataset</button>
      </div>
    </section>

    <main class="layout">
      <section class="graphPane">
        <canvas id="graphCanvas" width="1400" height="860"></canvas>
        <div class="timeline">
          <canvas id="timelineCanvas" width="1400" height="90"></canvas>
          <div class="row timelineControls">
            <input id="scrubber" type="range" min="0" max="1000" value="1000" />
            <button id="playBtn">▶ Play</button>
            <button id="stopBtn">■ Stop</button>
            <span id="timeLabel">Full range</span>
          </div>
        </div>
      </section>

      <aside class="sidePanel">
        <div class="tabs">
          <button class="tab active" data-tab="pivots">Pivots</button>
          <button class="tab" data-tab="telemetry">Telemetry</button>
          <button class="tab" data-tab="raw">Raw</button>
        </div>

        <section id="tab-pivots" class="tabBody active">
          <h3>Rarity pivots (z-score)</h3>
          <div id="pivotList" class="list"></div>
        </section>

        <section id="tab-telemetry" class="tabBody">
          <h3>Telemetry</h3>
          <pre id="telemetry"></pre>
          <h4>Selection Notes</h4>
          <textarea id="notesBox" rows="4" placeholder="Notes for selected node"></textarea>
          <button id="saveNoteBtn">Save note</button>
        </section>

        <section id="tab-raw" class="tabBody">
          <h3>Raw payload</h3>
          <pre id="rawDump"></pre>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
