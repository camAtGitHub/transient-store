<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C.A.M.C.E — Correlation & Analysis Mesh Correlation Engine</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111a31cc;
      --panel-solid: #111a31;
      --muted: #a6b3d9;
      --text: #e8edff;
      --accent: #53d8ff;
      --accent2: #9f7aea;
      --critical: #ef4444;
      --high: #f59e0b;
      --medium: #38bdf8;
      --low: #34d399;
      --good: #22c55e;
      --bad: #ef4444;
      --grid: #2a355d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top right, #1e2a57 0%, var(--bg) 42%) fixed;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .app {
      display: grid;
      grid-template-columns: 360px minmax(560px, 1fr) 420px;
      gap: 10px;
      height: 100vh;
      padding: 10px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid #2f3e6f;
      backdrop-filter: blur(8px);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2, .panel h3 {
      margin: 0;
      font-size: 14px;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: #c7d2fe;
    }
    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid #28365f;
      background: linear-gradient(180deg, #172143, #111a31);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .panel-body {
      padding: 10px;
      overflow: auto;
      min-height: 0;
    }
    .grid {
      display: grid;
      gap: 8px;
    }
    .grid.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea, button {
      width: 100%;
      border: 1px solid #324577;
      border-radius: 8px;
      color: var(--text);
      background: #0c1530;
      padding: 8px;
      font-size: 12px;
    }
    textarea { min-height: 74px; resize: vertical; }
    button {
      cursor: pointer;
      background: linear-gradient(180deg, #1f3c75, #19305d);
      font-weight: 600;
    }
    button.secondary { background: linear-gradient(180deg, #2a2a4f, #1c2040); }
    button.good { background: linear-gradient(180deg, #14532d, #0f3b22); border-color: #2a7f4c; }
    button.warn { background: linear-gradient(180deg, #78350f, #5c290c); border-color: #8e4a22; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; box-shadow: 0 0 0 2px #ffffff20 inset; }
    .status-live { background: var(--good); box-shadow: 0 0 10px #22c55e99; }
    .status-error { background: var(--bad); box-shadow: 0 0 10px #ef444499; }
    .muted { color: var(--muted); font-size: 11px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 4px 8px;
      border: 1px solid #40558f;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }
    .chip.active { background: #2b3f75; border-color: #6ea8ff; }
    #graphWrap {
      position: relative;
      flex: 1;
      background:
        linear-gradient(0deg, transparent 24%, color-mix(in oklab, var(--grid), transparent 75%) 25%, transparent 26%, transparent 74%, color-mix(in oklab, var(--grid), transparent 75%) 75%, transparent 76%),
        linear-gradient(90deg, transparent 24%, color-mix(in oklab, var(--grid), transparent 75%) 25%, transparent 26%, transparent 74%, color-mix(in oklab, var(--grid), transparent 75%) 75%, transparent 76%);
      background-size: 44px 44px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d3f71;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #timeline {
      height: 72px;
      border-radius: 10px;
      border: 1px solid #2d3f71;
      background: #0b1228;
      position: relative;
      overflow: hidden;
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tab { flex: 1; }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .table th, .table td {
      border-bottom: 1px solid #25345f;
      text-align: left;
      padding: 5px;
      vertical-align: top;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      border: 1px solid #4a5f9f;
      background: #20315f;
      margin-left: 4px;
    }
    .critical { color: #fecaca; background: #7f1d1d; border-color: #ef4444; }
    .small { font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="panel-header">
      <h2>Connection & Queries</h2>
      <div style="display:flex; align-items:center; gap:6px;"><span id="statusDot" class="status-dot"></span><span id="statusText" class="muted">idle</span></div>
    </div>
    <div class="panel-body grid">
      <div class="grid cols2">
        <div><label>Host</label><input id="host" placeholder="https://opensearch.example" /></div>
        <div><label>Username</label><input id="username" placeholder="admin" /></div>
      </div>
      <div><label>Password</label><input id="password" type="password" /></div>
      <div class="grid cols2">
        <button id="saveCreds">Save Credentials</button>
        <button class="secondary" id="loadSample">Load Demo Data</button>
      </div>

      <h3>Time Range</h3>
      <div class="grid cols2">
        <div>
          <label>Relative</label>
          <select id="relativeRange">
            <option value="1h">Last 1h</option><option value="4h" selected>Last 4h</option><option value="12h">Last 12h</option>
            <option value="1d">Last 1d</option><option value="7d">Last 7d</option><option value="30d">Last 30d</option>
          </select>
        </div>
        <div>
          <label>Mode</label>
          <select id="timeMode"><option value="relative" selected>Relative</option><option value="absolute">Absolute</option></select>
        </div>
      </div>
      <div class="grid cols2">
        <div><label>Start (absolute)</label><input id="absStart" type="datetime-local" /></div>
        <div><label>End (absolute)</label><input id="absEnd" type="datetime-local" /></div>
      </div>

      <h3>API Pull</h3>
      <div class="grid cols2">
        <button id="fetchFindings">Fetch Findings</button>
        <button id="fetchIOC">Fetch IOC Findings</button>
      </div>
      <div>
        <label>Hunt query (query_string)</label>
        <input id="huntQuery" placeholder="user.name:jsmith AND event.action:ssh_login" />
      </div>
      <button id="runHunt" class="warn">Run Hunt Search</button>
      <div class="muted mono" id="pullStats">No data loaded.</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>C.A.M.C.E Correlation Graph</h2>
      <div class="chip-row" id="legend"></div>
    </div>
    <div class="panel-body" style="display:flex; flex-direction:column; gap:8px;">
      <div class="grid cols2">
        <div>
          <label>Correlation Fields (comma)</label>
          <input id="fields" value="related.ip,related.user,related.hosts" />
        </div>
        <div>
          <label>Story Window (minutes)</label>
          <input id="storyWindow" type="number" value="30" min="1" />
        </div>
      </div>
      <div class="grid cols2">
        <div><label>Hub Threshold</label><input id="hubThreshold" type="number" value="5" min="2"/></div>
        <div><label>Layout</label><select id="layout"><option value="force" selected>Organic Force</option><option value="timeline">Story Chain</option><option value="grid">Grid</option></select></div>
      </div>
      <div class="grid cols2">
        <button id="correlate" class="good">Re-Correlate</button>
        <button id="resetLayout" class="secondary">Reset Layout</button>
      </div>
      <div class="chip-row" id="quickFilters"></div>
      <div id="graphWrap"><canvas id="graph"></canvas></div>
      <div id="timeline"><canvas id="timelineCanvas" width="1200" height="72"></canvas></div>
      <div class="grid cols2">
        <button id="play">Play</button><button id="stop" class="secondary">Stop</button>
      </div>
      <div class="muted" id="selection"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header"><h2>Pivots & Telemetry</h2></div>
    <div class="panel-body">
      <div class="tabs">
        <button class="tab" data-tab="rarity">Rarity</button>
        <button class="tab secondary" data-tab="paths">Paths</button>
        <button class="tab secondary" data-tab="telemetry">Telemetry</button>
      </div>
      <div id="tab-rarity"></div>
      <div id="tab-paths" style="display:none;"><div class="muted">Shift-click two nodes in graph to compute shortest path.</div><div id="pathResult"></div></div>
      <div id="tab-telemetry" style="display:none;"><pre class="mono small" id="telemetry"></pre></div>
      <h3 style="margin:12px 0 6px;">Investigation Notes</h3>
      <textarea id="notes" placeholder="Per-node notes (saved locally)"></textarea>
      <button id="saveNote" class="secondary">Save Note</button>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const severityColor = { critical: '#ef4444', high: '#f59e0b', medium: '#38bdf8', low: '#34d399', unknown: '#94a3b8' };

  const state = {
    store: { findingsById: new Map(), documentsById: new Map(), iocsById: new Map(), huntsById: new Map() },
    graph: { nodes: [], links: [], lookup: new Map(), filters: new Set(['finding','entity','ioc','hunt']) },
    selectedNodeId: null,
    notes: JSON.parse(localStorage.getItem('camce-notes') || '{}'),
    selectedForPath: [],
    playback: { running: false, tMin: null, tMax: null, current: null, raf: 0, durationMs: 10000 },
    sim: { dragging: null, panX: 0, panY: 0, scale: 1, running: true }
  };

  function saveCreds() {
    localStorage.setItem('camce-creds', JSON.stringify({ host: $('host').value.trim(), username: $('username').value.trim(), password: $('password').value }));
  }
  function loadCreds() {
    const c = JSON.parse(localStorage.getItem('camce-creds') || '{}');
    $('host').value = c.host || ''; $('username').value = c.username || ''; $('password').value = c.password || '';
  }

  function authHeaders() {
    const b64 = btoa(`${$('username').value}:${$('password').value}`);
    return { 'Authorization': `Basic ${b64}`, 'Content-Type': 'application/json' };
  }

  function timeBounds() {
    const now = Date.now();
    if ($('timeMode').value === 'absolute' && $('absStart').value && $('absEnd').value) {
      return { start: new Date($('absStart').value).getTime(), end: new Date($('absEnd').value).getTime() };
    }
    const rel = $('relativeRange').value;
    const m = { '1h': 3600000, '4h': 14400000, '12h': 43200000, '1d': 86400000, '7d': 604800000, '30d': 2592000000 };
    return { start: now - (m[rel] || 14400000), end: now };
  }

  function deepGet(obj, path) {
    return path.split('.').reduce((a, k) => (a && a[k] !== undefined ? a[k] : undefined), obj);
  }
  function normalizeArray(v) { return Array.isArray(v) ? v : (v === undefined || v === null ? [] : [v]); }

  function safeParseDocument(str) {
    if (typeof str !== 'string') return null;
    try { return JSON.parse(str); } catch {
      try { return JSON.parse(str.replace(/\\"/g, '"')); } catch { return null; }
    }
  }

  function normalizeFindings(payload) {
    const arr = payload?.findings || payload?.hits?.findings || payload?.data || [];
    arr.forEach((f, idx) => {
      const id = f.id || f.finding_id || f._id || `finding-${Date.now()}-${idx}`;
      const sev = (f.severity || f.severity_level || 'unknown').toString().toLowerCase();
      const t = Number(f.timestamp || f['.timestamp'] || f['@timestamp'] || Date.now());
      const relDocIds = new Set(normalizeArray(f.related_doc_ids || f.relatedDocIds));
      const docs = [];
      normalizeArray(f.document_list).forEach((d) => {
        const docId = d.id || d.document_id || d.doc_id;
        const parsed = safeParseDocument(d.document || d.raw || '');
        if (docId && parsed) {
          state.store.documentsById.set(String(docId), parsed);
          relDocIds.add(String(docId));
          docs.push({ docId: String(docId), parsed });
        }
      });
      state.store.findingsById.set(id, { ...f, id, severity: sev, timestamp: t, related_doc_ids: [...relDocIds], parsedDocs: docs });
    });
  }

  function normalizeIocs(payload) {
    const arr = payload?.findings || payload?.hits?.findings || payload?.data || [];
    arr.forEach((ioc, idx) => {
      const id = ioc.id || ioc.finding_id || ioc._id || `ioc-${Date.now()}-${idx}`;
      const rawRelated = normalizeArray(ioc.related_doc_ids || ioc.relatedDocIds);
      const relatedDocs = rawRelated.map((d) => String(d).split(':')[0]).map((docId) => ({ docId, doc: state.store.documentsById.get(docId) || null }));
      state.store.iocsById.set(id, { ...ioc, id, relatedDocs, timestamp: Number(ioc.timestamp || Date.now()) });
    });
  }

  function addNode(map, node) {
    const existing = map.get(node.id);
    if (existing) {
      existing.weight = (existing.weight || 1) + 1;
      if (node.timestamp) existing.timestamps.push(node.timestamp);
      return existing;
    }
    node.timestamps = node.timestamp ? [node.timestamp] : [];
    node.vx = 0; node.vy = 0; node.fx = null; node.fy = null;
    node.x = (Math.random() - .5) * 600; node.y = (Math.random() - .5) * 400;
    node.weight = 1;
    map.set(node.id, node);
    return node;
  }

  function addLink(links, s, t, meta) {
    const key = `${s.id}->${t.id}:${meta.kind || 'k'}`;
    let link = links.find(l => l.key === key);
    if (!link) {
      link = { key, source: s.id, target: t.id, count: 0, timestamps: [], ...meta };
      links.push(link);
    }
    link.count += 1;
    if (meta.timestamp) link.timestamps.push(meta.timestamp);
  }

  function correlate() {
    const fields = $('fields').value.split(',').map(s => s.trim()).filter(Boolean);
    const storyMs = Number($('storyWindow').value || 30) * 60000;
    const hubTh = Number($('hubThreshold').value || 5);
    const bounds = timeBounds();

    const nodeMap = new Map();
    const links = [];
    const entityMentions = new Map();

    const findings = [...state.store.findingsById.values()].filter(f => f.timestamp >= bounds.start && f.timestamp <= bounds.end);

    findings.forEach(f => {
      const fNode = addNode(nodeMap, { id: `finding:${f.id}`, type: 'finding', label: f.rule_name || f.id, severity: f.severity, timestamp: f.timestamp, raw: f });
      const docs = [];
      f.related_doc_ids.forEach(docId => {
        const parsed = state.store.documentsById.get(String(docId));
        if (!parsed) return;
        docs.push(parsed);
        addLink(links, fNode, addNode(nodeMap, { id: `doc:${docId}`, type: 'document', label: String(docId).slice(0,8), timestamp: f.timestamp, raw: parsed }), { kind: 'finding-doc', severity: f.severity, timestamp: f.timestamp });
      });
      const values = [];
      docs.forEach(doc => fields.forEach(fp => normalizeArray(deepGet(doc, fp)).forEach(v => values.push({ field: fp, value: String(v), timestamp: f.timestamp, sev: f.severity }))));
      values.forEach(({ field, value, timestamp, sev }) => {
        const entityId = `entity:${field}:${value}`;
        const eNode = addNode(nodeMap, { id: entityId, type: 'entity', subtype: field, label: value, timestamp, severity: sev });
        addLink(links, fNode, eNode, { kind: 'finding-entity', severity: sev, timestamp });
        if (!entityMentions.has(entityId)) entityMentions.set(entityId, []);
        entityMentions.get(entityId).push({ finding: f.id, timestamp });
      });
    });

    // temporal split + temporal bridges
    entityMentions.forEach((events, entityId) => {
      events.sort((a,b) => a.timestamp - b.timestamp);
      let inst = 1;
      let prev = null;
      for (const e of events) {
        if (prev && e.timestamp - prev.timestamp > storyMs) inst++;
        const splitId = `${entityId}#${inst}`;
        const base = nodeMap.get(entityId);
        if (!nodeMap.has(splitId)) {
          addNode(nodeMap, { ...base, id: splitId, label: `${base.label} [Inst ${inst}]`, type: 'entity' });
        }
        const fNode = nodeMap.get(`finding:${e.finding}`);
        addLink(links, fNode, nodeMap.get(splitId), { kind: 'temporal-split', severity: fNode.severity, timestamp: e.timestamp, inferred: true });
        prev = e;
      }
      nodeMap.delete(entityId);
    });

    // IOC overlay
    state.store.iocsById.forEach(ioc => {
      const iNode = addNode(nodeMap, { id: `ioc:${ioc.id}`, type: 'ioc', label: ioc.indicator || ioc.id, severity: 'high', timestamp: ioc.timestamp, raw: ioc });
      ioc.relatedDocs.forEach(({ docId }) => {
        const d = nodeMap.get(`doc:${docId}`);
        if (d) addLink(links, iNode, d, { kind: 'ioc-doc', severity: 'high', timestamp: ioc.timestamp });
      });
    });

    // hunts
    state.store.huntsById.forEach(h => {
      const hNode = addNode(nodeMap, { id: `hunt:${h.id}`, type: 'hunt', label: h.label || h.id, severity: 'medium', timestamp: h.timestamp, raw: h });
      normalizeArray(h.entities).forEach(ent => {
        const maybe = [...nodeMap.values()].find(n => n.type === 'entity' && n.label === String(ent));
        if (maybe) addLink(links, hNode, maybe, { kind: 'hunt-entity', severity: 'medium', timestamp: h.timestamp });
      });
    });

    const nodes = [...nodeMap.values()];

    // hub promotion annotation
    const degree = new Map(nodes.map(n => [n.id, 0]));
    links.forEach(l => { degree.set(l.source, (degree.get(l.source)||0)+1); degree.set(l.target, (degree.get(l.target)||0)+1); });
    nodes.forEach(n => { n.degree = degree.get(n.id)||0; if (n.type==='entity' && n.degree>=hubTh) n.hub=true; });

    state.graph.nodes = nodes;
    state.graph.links = links;
    state.graph.lookup = new Map(nodes.map(n => [n.id, n]));

    renderLegend();
    renderPivots();
    renderTelemetry();
    recomputeTimeRange();
    layoutGraph();
    drawGraph();
    drawTimeline();
  }

  async function fetchJson(path, method='GET', body=null) {
    const host = $('host').value.trim().replace(/\/$/, '');
    setStatus('loading', true);
    try {
      const r = await fetch(`${host}${path}`, { method, headers: authHeaders(), body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      const j = await r.json();
      setStatus('live', true);
      return j;
    } catch (e) {
      setStatus(String(e.message || e), false);
      throw e;
    }
  }

  function setStatus(msg, ok) {
    $('statusText').textContent = msg;
    const dot = $('statusDot');
    dot.className = 'status-dot ' + (msg === 'loading' ? '' : (ok ? 'status-live' : 'status-error'));
  }

  function renderLegend() {
    const counts = state.graph.nodes.reduce((a,n)=> (a[n.type]=(a[n.type]||0)+1, a), {});
    const legend = $('legend'); legend.innerHTML = '';
    Object.entries(counts).forEach(([k,v]) => {
      const c = document.createElement('span');
      c.className = 'chip ' + (state.graph.filters.has(k) ? 'active' : '');
      c.textContent = `${k} (${v})`;
      c.onclick = () => { if (state.graph.filters.has(k)) state.graph.filters.delete(k); else state.graph.filters.add(k); c.classList.toggle('active'); drawGraph(); drawTimeline(); renderTelemetry(); };
      legend.appendChild(c);
    });
  }

  function quickFilters() {
    const host = ['critical','high','medium','low'];
    const row = $('quickFilters'); row.innerHTML='';
    host.forEach(level => {
      const chip = document.createElement('span'); chip.className='chip'; chip.textContent = `sev:${level}`;
      chip.onclick = () => { state.graph.sevFilter = state.graph.sevFilter===level ? null : level; [...row.children].forEach(c=>c.classList.remove('active')); if(state.graph.sevFilter) chip.classList.add('active'); drawGraph(); };
      row.appendChild(chip);
    });
  }

  function getVisibleNodesLinks() {
    const nodes = state.graph.nodes.filter(n => state.graph.filters.has(n.type) && (!state.graph.sevFilter || n.severity===state.graph.sevFilter));
    const set = new Set(nodes.map(n=>n.id));
    let links = state.graph.links.filter(l => set.has(l.source) && set.has(l.target));
    if (state.playback.running && state.playback.current) links = links.filter(l => (Math.min(...(l.timestamps.length?l.timestamps:[0])) <= state.playback.current));
    return { nodes, links };
  }

  function layoutGraph() {
    const mode = $('layout').value;
    const { nodes } = getVisibleNodesLinks();
    if (mode === 'grid') {
      const cols = Math.ceil(Math.sqrt(nodes.length));
      nodes.forEach((n,i)=>{ n.x = (i%cols)*90 - cols*45; n.y = Math.floor(i/cols)*90 - cols*25; n.vx=0; n.vy=0; });
      return;
    }
    if (mode === 'timeline') {
      const ts = nodes.flatMap(n=>n.timestamps).sort((a,b)=>a-b);
      const min = ts[0]||Date.now(), max = ts[ts.length-1]||Date.now()+1;
      nodes.forEach((n,i)=>{
        const t = n.timestamps[0]||min;
        n.x = ((t-min)/(max-min+1))*900 - 450;
        const lane = ({finding:0,document:1,entity:2,ioc:3,hunt:4}[n.type] ?? (i%5));
        n.y = lane*95 - 200;
      });
      return;
    }
    // force layout warmup
    for (let i=0;i<120;i++) forceStep(0.015);
  }

  function forceStep(dt=0.016) {
    const { nodes, links } = getVisibleNodesLinks();
    const byId = state.graph.lookup;
    const repulsion = 2600, spring = 0.05, damping = 0.88;
    for (let i=0;i<nodes.length;i++) {
      const a = nodes[i];
      for (let j=i+1;j<nodes.length;j++) {
        const b = nodes[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const d2 = dx*dx + dy*dy + 0.01;
        const f = repulsion / d2;
        const fx = f*dx, fy = f*dy;
        a.vx += fx*dt; a.vy += fy*dt;
        b.vx -= fx*dt; b.vy -= fy*dt;
      }
    }
    links.forEach(l => {
      const s = byId.get(l.source), t = byId.get(l.target);
      if (!s || !t) return;
      const dx=t.x-s.x, dy=t.y-s.y; const dist=Math.hypot(dx,dy)+0.01;
      const target = 90 + Math.min(140, (s.degree+t.degree));
      const f = spring * (dist-target);
      const fx = f*dx/dist, fy = f*dy/dist;
      s.vx += fx*dt; s.vy += fy*dt; t.vx -= fx*dt; t.vy -= fy*dt;
    });
    nodes.forEach(n => {
      if (n.fx !== null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; return; }
      n.vx *= damping; n.vy *= damping;
      n.x += n.vx; n.y += n.vy;
    });
  }

  const graphCanvas = $('graph'), gctx = graphCanvas.getContext('2d');
  function resizeCanvas() {
    const r = graphCanvas.parentElement.getBoundingClientRect();
    graphCanvas.width = Math.floor(r.width * devicePixelRatio);
    graphCanvas.height = Math.floor(r.height * devicePixelRatio);
    gctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    drawGraph();
  }

  function screenToWorld(x,y) {
    const rect = graphCanvas.getBoundingClientRect();
    const cx = x - rect.left - rect.width/2;
    const cy = y - rect.top - rect.height/2;
    return { x: (cx - state.sim.panX)/state.sim.scale, y: (cy - state.sim.panY)/state.sim.scale };
  }

  function nodeAt(evt) {
    const p = screenToWorld(evt.clientX, evt.clientY);
    const { nodes } = getVisibleNodesLinks();
    for (let i=nodes.length-1; i>=0; i--) {
      const n = nodes[i];
      const r = 5 + Math.min(16, Math.sqrt(n.degree||1)*2);
      if ((n.x-p.x)**2 + (n.y-p.y)**2 <= r*r) return n;
    }
    return null;
  }

  function drawGraph() {
    const { width, height } = graphCanvas.getBoundingClientRect();
    gctx.clearRect(0,0,width,height);
    gctx.save();
    gctx.translate(width/2 + state.sim.panX, height/2 + state.sim.panY);
    gctx.scale(state.sim.scale, state.sim.scale);

    const { nodes, links } = getVisibleNodesLinks();
    const selected = state.graph.lookup.get(state.selectedNodeId);
    const oneHop = new Set();
    if (selected) links.forEach(l=>{ if (l.source===selected.id) oneHop.add(l.target); if (l.target===selected.id) oneHop.add(l.source); });

    links.forEach(l => {
      const s = state.graph.lookup.get(l.source), t = state.graph.lookup.get(l.target); if (!s||!t) return;
      const focused = !selected || l.source===selected.id || l.target===selected.id;
      gctx.globalAlpha = focused ? 0.8 : 0.08;
      gctx.strokeStyle = severityColor[l.severity] || '#64748b';
      gctx.lineWidth = 1 + Math.log1p(l.count);
      if (l.inferred) gctx.setLineDash([5,4]); else gctx.setLineDash([]);
      gctx.beginPath(); gctx.moveTo(s.x,s.y); gctx.lineTo(t.x,t.y); gctx.stroke();
      if (l.severity === 'critical') {
        const p = ((Date.now()/450)%1);
        const x = s.x + (t.x-s.x)*p, y = s.y + (t.y-s.y)*p;
        gctx.fillStyle = '#fca5a5'; gctx.beginPath(); gctx.arc(x,y,2.2,0,Math.PI*2); gctx.fill();
      }
    });
    gctx.setLineDash([]);

    nodes.forEach(n => {
      const r = 5 + Math.min(16, Math.sqrt(n.degree||1)*2);
      const isSel = selected && selected.id===n.id;
      const near = selected && oneHop.has(n.id);
      gctx.globalAlpha = (!selected || isSel || near) ? 0.96 : 0.12;
      const fill = n.type==='entity' ? '#93c5fd' : n.type==='finding' ? '#fda4af' : n.type==='ioc' ? '#fbbf24' : n.type==='hunt' ? '#a78bfa' : '#67e8f9';
      gctx.fillStyle = fill;
      gctx.beginPath(); gctx.arc(n.x,n.y,r,0,Math.PI*2); gctx.fill();
      gctx.strokeStyle = isSel ? '#ffffff' : (n.hub ? '#fde68a' : '#0f172a');
      gctx.lineWidth = isSel ? 2.5 : 1;
      gctx.stroke();
      if (isSel || r > 10) {
        gctx.fillStyle = '#e2e8f0'; gctx.font = '10px sans-serif';
        gctx.fillText(n.label.slice(0,18), n.x + r + 3, n.y + 3);
      }
    });
    gctx.restore();
  }

  function drawTimeline() {
    const c = $('timelineCanvas'); const ctx = c.getContext('2d');
    const w = c.width, h = c.height;
    ctx.clearRect(0,0,w,h); ctx.fillStyle='#0b1228'; ctx.fillRect(0,0,w,h);
    const { links } = getVisibleNodesLinks();
    const ts = links.flatMap(l => l.timestamps.length ? l.timestamps : []).sort((a,b)=>a-b);
    if (!ts.length) return;
    const min = ts[0], max = ts[ts.length-1];
    ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1;
    ts.forEach(t => {
      const x = ((t-min)/(max-min+1))*(w-20)+10;
      ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, h-14); ctx.stroke();
    });
    if (state.playback.running && state.playback.current) {
      const x = ((state.playback.current-min)/(max-min+1))*(w-20)+10;
      ctx.strokeStyle='#f87171'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
  }

  function recomputeTimeRange() {
    const ts = state.graph.links.flatMap(l => l.timestamps).sort((a,b)=>a-b);
    state.playback.tMin = ts[0] || Date.now();
    state.playback.tMax = ts[ts.length-1] || Date.now() + 1;
    state.playback.current = state.playback.tMin;
  }

  function playTimeline() {
    if (state.playback.running) return;
    state.playback.running = true;
    const start = performance.now();
    const { tMin, tMax, durationMs } = state.playback;
    function tick(now) {
      if (!state.playback.running) return;
      const p = Math.min(1, (now-start)/durationMs);
      state.playback.current = tMin + (tMax - tMin)*p;
      drawGraph(); drawTimeline();
      if (p < 1) state.playback.raf = requestAnimationFrame(tick);
      else state.playback.running = false;
    }
    state.playback.raf = requestAnimationFrame(tick);
  }
  function stopTimeline() {
    state.playback.running = false;
    cancelAnimationFrame(state.playback.raf);
    state.playback.current = state.playback.tMin;
    drawGraph(); drawTimeline();
  }

  function rarityStats() {
    const entities = state.graph.nodes.filter(n => n.type==='entity');
    const counts = entities.map(e => e.degree || 0);
    if (!counts.length) return [];
    const mean = counts.reduce((a,b)=>a+b,0)/counts.length;
    const variance = counts.reduce((a,b)=>a+(b-mean)**2,0)/counts.length;
    const sd = Math.sqrt(variance) || 1;
    return entities.map(e => ({ e, z: ((e.degree||0)-mean)/sd })).sort((a,b)=>a.z-b.z).slice(0,30);
  }

  function renderPivots() {
    const rows = rarityStats();
    $('tab-rarity').innerHTML = `<table class="table"><thead><tr><th>Entity</th><th>Field</th><th>Degree</th><th>Rarity Z</th></tr></thead><tbody>${rows.map(r=>`<tr data-node="${r.e.id}"><td>${r.e.label}${r.e.severity==='critical'?'<span class="badge critical">CRIT</span>':''}</td><td>${r.e.subtype||''}</td><td>${r.e.degree||0}</td><td>${r.z.toFixed(2)}</td></tr>`).join('')}</tbody></table>`;
    [...$('tab-rarity').querySelectorAll('tr[data-node]')].forEach(tr => tr.onclick = () => { state.selectedNodeId = tr.dataset.node; onSelectionChanged(); drawGraph(); });
  }

  function renderTelemetry() {
    const { nodes, links } = getVisibleNodesLinks();
    const span = state.graph.links.flatMap(l=>l.timestamps).sort((a,b)=>a-b);
    const payload = {
      visibleNodes: nodes.length,
      visibleEdges: links.length,
      findings: nodes.filter(n=>n.type==='finding').length,
      documents: nodes.filter(n=>n.type==='document').length,
      entities: nodes.filter(n=>n.type==='entity').length,
      ioc: nodes.filter(n=>n.type==='ioc').length,
      hunts: nodes.filter(n=>n.type==='hunt').length,
      timeSpanUTC: span.length ? { start: new Date(span[0]).toISOString(), end: new Date(span[span.length-1]).toISOString() } : null,
      selected: state.selectedNodeId
    };
    $('telemetry').textContent = JSON.stringify(payload, null, 2);
  }

  function shortestPath(aId,bId) {
    const { links } = getVisibleNodesLinks();
    const adj = new Map();
    function add(u,v){ if(!adj.has(u)) adj.set(u,[]); adj.get(u).push(v); }
    links.forEach(l=>{ add(l.source,l.target); add(l.target,l.source); });
    const q=[aId], prev = new Map([[aId,null]]);
    while(q.length){
      const u=q.shift(); if(u===bId) break;
      (adj.get(u)||[]).forEach(v=>{ if(!prev.has(v)){ prev.set(v,u); q.push(v);} });
    }
    if(!prev.has(bId)) return null;
    const path=[]; let cur=bId; while(cur){ path.push(cur); cur=prev.get(cur);} return path.reverse();
  }

  function onSelectionChanged() {
    const n = state.graph.lookup.get(state.selectedNodeId);
    if (!n) { $('selection').textContent = ''; return; }
    $('selection').textContent = `${n.type.toUpperCase()} • ${n.label} • degree=${n.degree||0}`;
    $('notes').value = state.notes[n.id] || '';
    renderTelemetry();
  }

  async function runFetchFindings() {
    const j = await fetchJson('/_plugins/_security_analytics/findings/_search?size=5000&sortOrder=desc');
    normalizeFindings(j);
    $('pullStats').textContent = `Findings: ${state.store.findingsById.size}, Documents: ${state.store.documentsById.size}`;
    correlate();
  }
  async function runFetchIOC() {
    const j = await fetchJson('/_plugins/_security_analytics/threat_intel/findings/_search?size=5000&sortOrder=desc');
    normalizeIocs(j);
    $('pullStats').textContent = `Findings: ${state.store.findingsById.size}, Documents: ${state.store.documentsById.size}, IOC: ${state.store.iocsById.size}`;
    correlate();
  }
  async function runHunt() {
    const q = $('huntQuery').value.trim(); if (!q) return;
    const bounds = timeBounds();
    const j = await fetchJson('/_search', 'POST', { query: { bool: { must: [{ query_string: { query: q, analyze_wildcard: true, time_zone: 'UTC' } }], filter: [{ range: { '@timestamp': { gte: bounds.start, lte: bounds.end, format: 'epoch_millis' } } }] } } });
    normalizeArray(j?.hits?.hits).forEach((h, idx) => {
      const id = h._id || `hunt-${Date.now()}-${idx}`;
      const src = h._source || {};
      const ents = ['related.ip','related.user','related.hosts','related.email','related.domain'].flatMap(f => normalizeArray(deepGet(src,f)));
      state.store.huntsById.set(id, { id, label: q, timestamp: Number(src['@timestamp'] ? new Date(src['@timestamp']).getTime() : Date.now()), entities: ents, raw: src });
    });
    correlate();
  }

  function loadSampleData() {
    const now = Date.now();
    const sample = {
      findings: Array.from({length: 22}).map((_,i)=>({
        id: `f-${i+1}`,
        severity: i%7===0 ? 'critical' : i%3===0 ? 'high' : 'medium',
        timestamp: now - (i*17*60000),
        related_doc_ids: [`d-${i+1}`],
        document_list: [{id: `d-${i+1}`, document: JSON.stringify({
          related: {
            ip: [`10.0.${i%6}.${i+10}`, i%4===0 ? '185.231.9.5' : `172.16.2.${i%20}`],
            user: [i%5===0 ? 'svc-backup' : `jsmith${i%4}`],
            hosts: [`prod-app-${(i%5)+1}`],
            email: [`analyst${i%3}@example.com`],
            domain: [i%6===0 ? 'drop-loader.biz' : 'corp.local']
          },
          event: { action: i%4===0 ? 'ssh_login' : 'process_start', outcome: i%5===0 ? 'failure' : 'success' },
          '@timestamp': new Date(now - i*17*60000).toISOString()
        }) }]
      }))
    };
    const ioc = { findings: [
      { id: 'ioc-1', indicator: '185.231.9.5', related_doc_ids: ['d-5','d-9','d-13'], timestamp: now-2_000_000 },
      { id: 'ioc-2', indicator: 'drop-loader.biz', related_doc_ids: ['d-6','d-12'], timestamp: now-1_000_000 },
    ]};
    normalizeFindings(sample); normalizeIocs(ioc);
    state.store.huntsById.set('hunt-sample', { id: 'hunt-sample', label: 'user.name:jsmith1 AND event.action:ssh_login', timestamp: now-700000, entities: ['jsmith1', '185.231.9.5'] });
    $('pullStats').textContent = `Demo loaded → Findings: ${state.store.findingsById.size} Documents: ${state.store.documentsById.size} IOC: ${state.store.iocsById.size}`;
    correlate();
  }

  function loop() {
    if ($('layout').value === 'force') forceStep(0.016);
    drawGraph();
    requestAnimationFrame(loop);
  }

  // events
  $('saveCreds').onclick = saveCreds;
  $('fetchFindings').onclick = () => runFetchFindings().catch(()=>{});
  $('fetchIOC').onclick = () => runFetchIOC().catch(()=>{});
  $('runHunt').onclick = () => runHunt().catch(()=>{});
  $('correlate').onclick = correlate;
  $('resetLayout').onclick = () => { state.graph.nodes.forEach(n=>{n.x=(Math.random()-.5)*600;n.y=(Math.random()-.5)*400;n.vx=0;n.vy=0;}); layoutGraph(); drawGraph(); };
  $('play').onclick = playTimeline; $('stop').onclick = stopTimeline;
  $('loadSample').onclick = loadSampleData;
  $('saveNote').onclick = () => {
    if (!state.selectedNodeId) return;
    state.notes[state.selectedNodeId] = $('notes').value;
    localStorage.setItem('camce-notes', JSON.stringify(state.notes));
  };

  document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.add('secondary'));
    btn.classList.remove('secondary');
    ['rarity','paths','telemetry'].forEach(t => $(`tab-${t}`).style.display = (t===btn.dataset.tab ? '' : 'none'));
  });

  graphCanvas.addEventListener('mousedown', (e) => {
    const n = nodeAt(e);
    if (n) {
      state.sim.dragging = n;
      n.fx = n.x; n.fy = n.y;
      if (e.shiftKey) {
        state.selectedForPath.push(n.id);
        if (state.selectedForPath.length > 2) state.selectedForPath.shift();
        if (state.selectedForPath.length === 2) {
          const path = shortestPath(state.selectedForPath[0], state.selectedForPath[1]);
          $('pathResult').innerHTML = path ? `<div class='mono'>${path.map(id=>state.graph.lookup.get(id)?.label||id).join(' → ')}</div>` : '<span class="muted">No visible path.</span>';
        }
      } else {
        state.selectedNodeId = n.id;
        onSelectionChanged();
      }
    } else {
      state.sim.panning = { x: e.clientX, y: e.clientY, ox: state.sim.panX, oy: state.sim.panY };
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (state.sim.dragging) {
      const p = screenToWorld(e.clientX, e.clientY);
      state.sim.dragging.fx = p.x; state.sim.dragging.fy = p.y;
    }
    if (state.sim.panning) {
      state.sim.panX = state.sim.panning.ox + (e.clientX - state.sim.panning.x);
      state.sim.panY = state.sim.panning.oy + (e.clientY - state.sim.panning.y);
    }
  });
  window.addEventListener('mouseup', () => {
    if (state.sim.dragging) { state.sim.dragging.fx = null; state.sim.dragging.fy = null; }
    state.sim.dragging = null; state.sim.panning = null;
  });
  graphCanvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    state.sim.scale = Math.max(0.2, Math.min(3.5, state.sim.scale * factor));
  }, { passive: false });

  window.addEventListener('resize', resizeCanvas);

  loadCreds();
  quickFilters();
  resizeCanvas();
  loop();
})();
</script>
</body>
